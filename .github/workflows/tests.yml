name: Python tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests -v
  morphhb-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout upstream MorphHB
        run: |
          git clone --depth 1 https://github.com/openscriptures/morphhb.git /tmp/morphhb
          git -C /tmp/morphhb fetch --depth 1 origin db6c5c9b46b8f39346f10915ddb1a70dcd429901
          git -C /tmp/morphhb checkout --detach db6c5c9b46b8f39346f10915ddb1a70dcd429901
      - name: Extract complete WLC and record exact source revision
        run: |
          REVISION=$(git -C /tmp/morphhb rev-parse HEAD)
          python scripts/import_morphhb.py --input /tmp/morphhb/wlc --output build/morphhb-tokens.jsonl --qere-output build/morphhb-qere.jsonl --revision "$REVISION"
          test $(wc -l < build/morphhb-tokens.jsonl) -gt 100000
          python scripts/audit_morphhb.py --input /tmp/morphhb/wlc --output build/morphhb-tokens.jsonl
          python scripts/letter_vav_candidates.py --tokens build/morphhb-tokens.jsonl --output build/lemma-candidates.json
          python -c 'import json; d=json.load(open("build/lemma-candidates.json")); assert len(d["entries"]) > 1000; assert all(e["headword"] is None for e in d["entries"])'
          git clone --depth 1 https://github.com/openscriptures/HebrewLexicon.git /tmp/hebrew-lexicon
          git -C /tmp/hebrew-lexicon fetch --depth 1 origin 21c9add13bc727d3a951361778e97e3ff7afd1ce
          git -C /tmp/hebrew-lexicon checkout --detach 21c9add13bc727d3a951361778e97e3ff7afd1ce
          python scripts/resolve_letter_vav.py --candidates build/lemma-candidates.json --lexicon /tmp/hebrew-lexicon --output build/letter-vav.json
          python -c 'import json; d=json.load(open("build/letter-vav.json")); assert len(d["entries"]) > 0; assert all(e["initialLetter"] == "ו" for e in d["entries"])'
          python scripts/verify_letter_vav.py --generated build/letter-vav.json --checked data/letter-vav-verified.json
          python scripts/build_letter_vav_occurrences.py --tokens build/morphhb-tokens.jsonl --inventory data/letter-vav-verified.json --output build/letter-vav-occurrences.json
          python -c 'import json; d=json.load(open("build/letter-vav-occurrences.json")); assert d["totalOccurrences"] == 31 and len(d["entries"]) == 10'
          python -c 'import json; d=json.load(open("build/letter-vav-occurrences.json")); print("VAV_OCCURRENCES_JSON="+json.dumps(d, ensure_ascii=False, separators=(",",":")))'
          python -c 'import json; a=json.load(open("build/letter-vav-occurrences.json")); b=json.load(open("data/letter-vav-occurrences.json")); assert a == b, "Committed occurrences differ from generated source"'
          echo "MorphHB revision: $REVISION"
          echo "HebrewLexicon revision: $(git -C /tmp/hebrew-lexicon rev-parse HEAD)"
          python -c 'import json; d=json.load(open("build/letter-vav.json")); print("VAV_CANDIDATES_JSON="+json.dumps(d["entries"], ensure_ascii=False, separators=(",",":")))'

  publish-alphabet:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/full-alphabet-concordance'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/full-alphabet-concordance
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Load pinned corpora
        run: |
          git clone --depth 1 https://github.com/openscriptures/morphhb.git /tmp/morphhb
          git -C /tmp/morphhb fetch --depth 1 origin db6c5c9b46b8f39346f10915ddb1a70dcd429901
          git -C /tmp/morphhb checkout --detach db6c5c9b46b8f39346f10915ddb1a70dcd429901
          git clone --depth 1 https://github.com/openscriptures/HebrewLexicon.git /tmp/lexicon
          git -C /tmp/lexicon fetch --depth 1 origin 21c9add13bc727d3a951361778e97e3ff7afd1ce
          git -C /tmp/lexicon checkout --detach 21c9add13bc727d3a951361778e97e3ff7afd1ce
          python scripts/import_morphhb.py --input /tmp/morphhb/wlc --output build/tokens.jsonl --revision db6c5c9b46b8f39346f10915ddb1a70dcd429901
          python scripts/audit_morphhb.py --input /tmp/morphhb/wlc --output build/tokens.jsonl
      - name: Build all 22 letters
        run: |
          python - <<'PY'
          import concurrent.futures,subprocess,json,pathlib
          letters="אבגדהוזחטיכלמנסעפצקרשת"
          def generate(letter):
              subprocess.run(["python","scripts/build_alphabet_concordance.py","--tokens","build/tokens.jsonl","--lexicon","/tmp/lexicon","--letter",letter,"--output",f"data/alphabet/{letter}.json"],check=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              list(pool.map(generate,letters))
          summary=[]
          for letter in letters:
              d=json.loads(pathlib.Path(f"data/alphabet/{letter}.json").read_text())
              assert d["letter"]==letter and d["entryCount"]==len(d["entries"])
              assert d["totalOccurrences"]==sum(e["occurrenceCount"] for e in d["entries"])
              summary.append({"letter":letter,"entryCount":d["entryCount"],"occurrenceCount":d["totalOccurrences"]})
          pathlib.Path("data/alphabet/manifest.json").write_text(json.dumps({"status":"machine-generated-needs-human-review","letters":summary,"totalEntries":sum(x["entryCount"] for x in summary),"totalOccurrences":sum(x["occurrenceCount"] for x in summary)},ensure_ascii=False,indent=2)+"\\n")
          PY
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/alphabet
          if ! git diff --cached --quiet; then
            git commit -m "data: generate all 22 letter occurrence files"
            git push origin HEAD:feat/full-alphabet-concordance
          fi
