name: Publish Hebrew concordance to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'data/alphabet/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and validate static site
        run: |
          mkdir -p _site/data
          cp docs/index.html _site/index.html
          cp -r data/alphabet _site/data/
          touch _site/.nojekyll
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path("_site/data/alphabet")
          manifest=json.loads((root/"manifest.json").read_text())
          assert len(manifest["letters"])==22
          for x in manifest["letters"]:
              p=root/(x["letter"]+".json")
              assert p.is_file(), str(p)
              d=json.loads(p.read_text())
              assert d["letter"]==x["letter"]
          assert pathlib.Path("_site/index.html").is_file()
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Confirm artifact exists in build job
        run: echo "Pages artifact upload step completed"
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
